<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заявки — Фрукты&amp;Ко</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">Фрукты&amp;Ко</a>
      <nav class="nav" aria-label="Основная навигация">
        <ul class="nav__list">
        <li><a class="nav__link" href="index.html">Главная</a></li>
        <li><a class="nav__link" href="catalog.html">Каталог</a></li>
        <li><a class="nav__link" href="order.html" aria-current="page">Заявка</a></li>
        <li><a class="nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container container--narrow">
    <h1>Оформление заявки</h1>
    <p class="lead">Оставьте контакты — менеджер перезвонит в течение 15 минут.</p>
    <form class="order-form" id="order-form" action="#" method="post" novalidate>
      <input id="selected-product" name="selected-product" type="hidden">
      <div class="form-field">
        <label for="order-name">Имя</label>
        <input id="order-name" name="name" type="text" placeholder="Введите ваше имя" minlength="2" autocomplete="given-name" required>
      </div>
      <div class="form-field">
        <label for="order-email">E-mail</label>
        <input id="order-email" name="email" type="email" placeholder="example@mail.ru" autocomplete="email" required>
      </div>
      <div class="form-field">
        <label for="order-phone">Телефон</label>
        <input id="order-phone" name="phone" type="tel" inputmode="tel" placeholder="+7 (900) 000-00-00" pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$" required>
        <small>Формат: +7 (900) 000-00-00</small>
      </div>
      <div class="form-field">
        <label for="order-date">Дата доставки</label>
        <input id="order-date" name="date" type="date">
      </div>
      <div class="form-field">
        <label for="order-topic">Тема заявки</label>
        <select id="order-topic" name="topic" required>
          <option value="">Выберите тему</option>
          <option value="product">Заказ фруктов</option>
          <option value="consultation">Консультация</option>
          <option value="delivery">Доставка</option>
        </select>
      </div>
      <div class="form-field">
        <label for="order-comment">Комментарий</label>
        <textarea id="order-comment" name="comment" rows="3" placeholder="Вес, степень зрелости, удобное время"></textarea>
      </div>
      <div class="form-field form-field--checkbox">
        <label><input id="order-agreement" name="agreement" type="checkbox" required> Я согласен на обработку данных</label>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">Отправить заявку</button>
      </div>
    </form>
    <p class="success-message" id="success-message" hidden>Форма успешно отправлена!</p>
  </main>

  <footer class="footer" id="contacts">
    <div class="container footer__inner">
      <p>&copy; 2026 Фрукты&amp;Ко. Учебный проект.</p>
      <p>Дисциплина: Фронтенд и бэкенд разработка</p>
    </div>
  </footer>
</body>
</html>
